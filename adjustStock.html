    function processSearch() {
    const searchInput = document.getElementById('itemSearch');
    const query = searchInput.value.trim();
    if (!query) return;

    const queryLower = query.toLowerCase();

    // 1. Search existing items array
    let matchedItem = items.find(item => 
        (item.barcode && String(item.barcode).toLowerCase() === queryLower) ||
        (item.id && String(item.id).toLowerCase() === queryLower) ||
        (item.type && String(item.type).toLowerCase() === queryLower)
    );

    let price = 0;

    if (!matchedItem) {
        // Option A: Custom Item (not found in stock list)
        let itemName=  prompt(`Enter Item Name for custom item "${query}":`, "0");
        let enteredPrice = prompt(`Enter cost price for custom item "${query}":`, "0"); 
        let salePrice = prompt(`Enter Sale price for custom item "${query}":`, "0");  
        let count = prompt(`Enter count for custom item "${query}":`, "0");       
        if (enteredPrice === null) return; // Cancelled by user
        
        price = parseFloat(enteredPrice) || 0;

        matchedItem = {
            id: "CUSTOM",
            barcode:query,
            type: itemName,
            averageCost: salePrice,
            cost: enteredPrice,
            category: "Custom",
            count:count,
            newitem:"new"
        };

    } else if (matchedItem.category && matchedItem.category.toLowerCase() === "maintenance") {
        // Option B: Known item, but belongs to Maintenance category
        let defaultPrice = matchedItem.cost || 0;
        let enteredPrice = prompt(`Enter maintenance charge for "${matchedItem.type}":`, defaultPrice);
        if (enteredPrice === null) return; // Cancelled by user
        
        price = parseFloat(enteredPrice) || 0;

        // Clone item to assign the custom maintenance price without mutating original stock
        matchedItem = { ...matchedItem, cost: price };
    }

    addItemToCartOrIntake(matchedItem);
    searchInput.value = '';
}
